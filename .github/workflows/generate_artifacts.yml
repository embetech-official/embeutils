name: Generate Artifacts

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  library:
    # embeutils is header-only: a single install tree already serves every architecture, so unlike
    # the sibling repos there is no per-architecture matrix (and no per-architecture merge step).
    name: 📦 Build & Install
    runs-on: ubuntu-latest
    env:
      preset: native-gcc
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 🛠️ Install CMake
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3

      - name: 📚 Install Doxygen
        uses: ssciwr/doxygen-install@329d88f5a303066a5bd006db7516b1925b86350e # v2.0.1

      - name: 🔧 Setup GCC toolchain
        uses: jmacheta/setup-gcc-toolchain@7aad7bd3b57f5a236de0ea43b232d19f644fb5c4 # v2.1.1
        with:
          toolchain: x86_64-gcc
          version: latest

      - name: 🏗️ Build and install library
        uses: lukka/run-cmake@5d55ea7949e25f69f0ecb516d8d572297e03a956 # v10.9
        with:
          configurePreset: ${{ env.preset }}
          configurePresetAdditionalArgs: >-
            ["-DEMBEUTILS_TESTS=0", "-DEMBEUTILS_DOC=1"]
          buildPreset: ${{ env.preset }}-install

      - name: 📚 Generate documentation
        run: cmake --build build/${{ env.preset }} --target embeutils_doc:Release

      - name: ⬆️ Upload library install directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libembeutils
          path: install/${{ env.preset }}/**
          if-no-files-found: error
          retention-days: 1

  portability_check:
    name: 🌍 Portability check (${{ matrix.config.toolchain }})
    needs: library
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - { toolchain: x86_64-gcc,               vendor: ""    }
          - { toolchain: x86_64-w64-mingw32-gcc,    vendor: ""    }
          - { toolchain: aarch64-none-linux-gnu,    vendor: ""    }
          - { toolchain: arm-none-linux-gnueabihf,  vendor: ""    }
          - { toolchain: arm-none-eabi,             vendor: "arm" }
    steps:
      - name: 🧹 Prepare clean smoke-test directory
        run: rm -rf smoke && mkdir -p smoke

      - name: ⬇️ Download library package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libembeutils
          path: smoke/package

      - name: 🔧 Setup GCC toolchain (${{ matrix.config.toolchain }})
        uses: jmacheta/setup-gcc-toolchain@7aad7bd3b57f5a236de0ea43b232d19f644fb5c4 # v2.1.1
        with:
          toolchain: ${{ matrix.config.toolchain }}
          vendor: ${{ matrix.config.vendor }}
          version: latest

      - name: ✍️ Write smoke-test translation unit
        working-directory: smoke
        run: |
          cat > smoke.c <<'EOF'
          #include <embetech/endianness.h>

          void embeutils_portability_smoke(void *dst, void const *src, size_t length) {
              ENDIANNESS_Reverse(dst, src, length);
          }
          EOF
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.28)
          project(embeutils_portability_smoke C)
          find_package(embeutils REQUIRED)
          add_library(smoke OBJECT smoke.c)
          target_link_libraries(smoke PRIVATE embetech::utils)
          EOF

      - name: 🌍 Compile smoke test against the installed package
        working-directory: smoke
        run: |
          cmake -S . -B build -DCMAKE_PREFIX_PATH="${PWD}/package"
          cmake --build build

  package-core:
    name: 📦 Package combined archive
    needs: [library, portability_check]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: 🔖 Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: ⬇️ Download install directory
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: libembeutils
          path: package/embeutils-${{ steps.version.outputs.version }}
          merge-multiple: true

      - name: ⬆️ Upload combined package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: embeutils-${{ steps.version.outputs.version }}
          path: package/**
          if-no-files-found: error
          retention-days: 1

  cleanup:
    name: 🧹 Remove intermediate artifacts
    needs: package-core
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 🧹 Delete intermediate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("libembeutils")) | .id' |
          while read -r id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
